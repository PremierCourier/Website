<section class="section page-head">
  <div class="container container--reading">
    <h1 class="page-head__title">{{ page.heading }}</h1>
    <p class="lead">{{ page.lead }}</p>
  </div>
</section>

<section class="section section--tight">
  <div class="container container--reading">
    <form class="quote-form" action="{{ quoteEndpoint }}" method="post" novalidate
          data-endpoint="{{ quoteEndpoint }}" data-required="{{ page.fields.required }}" data-sending="{{ page.fields.sending }}">
      <div class="field">
        <label for="pickup">{{ page.fields.pickup }}</label>
        <input id="pickup" name="pickup" type="text" autocomplete="street-address" required aria-describedby="address-hint">
      </div>
      <div class="field">
        <label for="dropoff">{{ page.fields.dropoff }}</label>
        <input id="dropoff" name="dropoff" type="text" required aria-describedby="address-hint">
        <p class="field__hint" id="address-hint">{{ page.fields.addressHint }}</p>
      </div>
      <div class="field">
        <label for="what">{{ page.fields.what }}</label>
        <select id="what" name="what" required>
          <option value="" selected disabled></option>
          {{#each page.fields.whatOptions}}<option value="{{ value }}">{{ label }}</option>
          {{/each}}
        </select>
      </div>
      <div class="field">
        <label for="when">{{ page.fields.when }}</label>
        <select id="when" name="when" required>
          <option value="" selected disabled></option>
          {{#each page.fields.whenOptions}}<option value="{{ value }}">{{ label }}</option>
          {{/each}}
        </select>
        <p class="field__note" data-now-note hidden>{{ page.fields.nowNote }} <a href="tel:{{ phone.tel }}">{{ phone.display }}</a></p>
      </div>
      <div class="field" data-date-field hidden>
        <label for="date">{{ page.fields.date }}</label>
        <input id="date" name="date" type="date" aria-describedby="scheduled-note">
        <p class="field__hint" id="scheduled-note">{{ page.fields.scheduledNote }}</p>
      </div>
      <div class="field">
        <label for="name">{{ page.fields.name }}</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="phone">{{ page.fields.phone }}</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="email">{{ page.fields.email }}</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="field field--hp" aria-hidden="true">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button class="button button--primary" type="submit">{{ page.fields.submit }}</button>
      {{#if exists./privacy/}}<p class="field__hint"><a href="{{ base }}/privacy/">{{ page.fields.privacyLink }}</a></p>{{/if}}
    </form>

    <div class="form-result form-result--ok" role="status" tabindex="-1" hidden>
      <p class="form-result__heading">{{ page.success }}</p>
      <p><a href="tel:{{ phone.tel }}">{{ phone.display }}</a> · {{ hoursShort }}</p>
    </div>
    <div class="form-result form-result--fail" role="alert" tabindex="-1" hidden>
      <p class="form-result__heading"><a href="tel:{{ phone.tel }}">{{ cta.formFailure }}</a></p>
    </div>
  </div>
</section>
