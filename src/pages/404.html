<section class="section page-head">
  <div class="container container--reading">
    <h1 class="page-head__title">{{ page.heading }}</h1>
    <p class="lead">{{ page.lead }}</p>
    <div class="button-row">
      <a class="button button--primary" href="{{ base }}/">{{ page.homeLabel }}</a>
      <a class="button button--secondary" href="tel:{{ phone.tel }}">Call {{ phone.display }}</a>
    </div>
  </div>
</section>
