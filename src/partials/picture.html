<picture>{{#if srcsetAvif}}<source type="image/avif" srcset="{{ srcsetAvif }}" sizes="(max-width: 768px) 80vw, 440px"><source type="image/webp" srcset="{{ srcsetWebp }}" sizes="(max-width: 768px) 80vw, 440px">{{else}}<source type="image/avif" srcset="{{ avif }}"><source type="image/webp" srcset="{{ webp }}">{{/if}}<img src="{{ fallback }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}"{{#if lazy}} loading="lazy"{{/if}} decoding="async"></picture>
