<ul class="area-list">
  {{#each counties}}<li class="area-list__county">
    <h3 class="area-list__name">{{#if route}}<a href="{{ base }}{{ route }}">{{ name }}</a>{{else}}{{ name }}{{/if}}</h3>
    <p class="area-list__towns">{{#each towns}}{{ this }}{{#unless @last}} · {{/unless}}{{/each}}</p>
  </li>
  {{/each}}
</ul>
